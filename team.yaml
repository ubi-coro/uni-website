head:  # Leitung / Head of Group
  - name: Prof. Dr. rer. nat. Klaus Neumann
    pevz: 26109209
    email: klaus.neumann@uni-bielefeld.de
    photo: /fakultaeten/technische-fakultaet/arbeitsgruppen/kollaborative-robotik/team/Klaus-Neumann.jpg
    links:
      orcid: https://orcid.org/0009-0008-7221-0441
      scholar: https://scholar.google.com/citations?user=BuECEIcAAAAJ
      linkedin: https://www.linkedin.com/in/klaus-neumann-995aa391/
      openreview: https://openreview.net/profile?id=~Klaus_Neumann1
    intro:
      de: Ich bin Klaus Neumann, Professor für Kollaborative Robotik an der Universität Bielefeld und Forschungsgruppenleiter am Fraunhofer IOSB-INA, wo wir daran arbeiten, Roboter intelligenter, anpassungsfähiger und bereit für die reale Welt zu machen. Meine Forschung konzentriert sich auf KI-gesteuerte Robotik, die Bereiche wie verstärktes Lernen, Imitationslernen und Vision-Language-Action-Modelle (VLAs) umfasst, wobei mir das Vermitteln komplexer Manipulationsfähigkeiten an Roboter besonders am Herzen liegt. Von humanoiden Robotern bis hin zu magnetisch schwebenden Robotern (MagBots) ist es mein Ziel, die Grenzen dessen zu erweitern, was intelligente Maschinen in den Fabriken von morgen lernen und leisten können.
      en: I'm Klaus Neumann, Professor of Collaborative Robotics at Bielefeld University and Research Group Leader at Fraunhofer IOSB-INA, where we work on making robots smarter, more adaptable, and ready for the real world. My research focuses on AI-driven robotics, spanning reinforcement learning, imitation learning, and vision-language-action models (VLAs), with a particular passion for teaching robots complex manipulation skills. From humanoid robots to magnetically levitating robots (MagBots), my goal is to push the boundaries of what intelligent machines can learn and achieve in the factories of tomorrow.

