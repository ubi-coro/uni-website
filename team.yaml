  - name: József Lurvig
    pevz: 287975422
    email: jozsef.lurvig@uni-bielefeld.de
    intro:
      de: "Ich arbeite im enableATO-Projekt an der Umfelderkennung für autonom fahrende Schienenfahrzeuge. Mit einem selbst aufgebauten Sensorfahrzeug nehme ich reale Daten auf und verbinde sie mit Simulation: Per Gaussian Splatting rekonstruierte reale Szenen fließen in die Simulatoren ein, damit synthetische Trainingsdaten der Wirklichkeit möglichst nahekommen."
      en: "I work in the enableATO project on environment perception for autonomous rail vehicles. I record real-world data with a sensor vehicle we built ourselves and combine it with simulation: real scenes reconstructed with Gaussian Splatting are brought into the simulators, so that synthetic training data comes as close to reality as possible."
