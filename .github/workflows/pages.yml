name: Build pages

on:
  schedule:
    - cron: "17 3 * * *"  # nightly, 03:17 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          # Dependencies are declared inline in the scripts (PEP 723)
          cache-dependency-glob: "*.py"
      # Any failed fetch or an empty result exits non-zero, so nothing gets deployed and the last good version stays live
      - run: uv run generate_teaching.py --out-dir _site --ext html
      - run: uv run generate_team.py --out-dir _site --ext html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
